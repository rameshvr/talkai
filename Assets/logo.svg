<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Microphone body -->
  <rect x="216" y="120" width="80" height="140" rx="40" ry="40" fill="white"/>

  <!-- Microphone stand arc -->
  <path d="M 176 240 Q 176 320 256 320 Q 336 320 336 240"
        fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/>

  <!-- Microphone stand line -->
  <line x1="256" y1="320" x2="256" y2="370" stroke="white" stroke-width="24" stroke-linecap="round"/>

  <!-- AI sparkle dots - representing intelligence -->
  <circle cx="370" cy="140" r="12" fill="rgba(255,255,255,0.9)"/>
  <circle cx="400" cy="180" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="380" cy="210" r="6" fill="rgba(255,255,255,0.4)"/>
</svg>
