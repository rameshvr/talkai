name: Release

# Fully automatic releases: any push to main containing fix:/feat: commits
# (conventional commits) cuts a release — semver bump, release notes, DMG,
# and a Homebrew tap update. chore:/docs:/ci: pushes release nothing.
on:
  push:
    branches: [main]

# Never let two pushes race the version computation.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tag action can find the last release tag.
          fetch-depth: 0

      - name: Compute next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          # No fix:/feat: since the last tag → no tag, no release.
          default_bump: false

      - name: Build release DMG
        if: steps.tag.outputs.new_tag
        run: ./release.sh "${{ steps.tag.outputs.new_version }}"

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: TalkAI ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: TalkAI-v${{ steps.tag.outputs.new_version }}-mac.dmg

      - name: Update Homebrew tap
        if: steps.tag.outputs.new_tag
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          SHA256=$(shasum -a 256 "TalkAI-v${VERSION}-mac.dmg" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rameshvr/homebrew-talkai.git" tap
          cd tap
          sed -i '' \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            Casks/talkai.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "talkai ${VERSION}"
          git push
